name: Rubric Labs
description: >-
  Rubric Labs is an applied AI lab based in Canada that helps companies build and
  ship intelligent, agent-powered applications. Rather than selling a public API
  product, Rubric Labs operates as an engineering partner and maintains open-source
  tooling for AI-first development, including create-rubric-app (a full-stack AI
  project scaffold inspired by create-next-app), maige (open-source infrastructure
  for running natural-language workflows on your codebase), and tokenmaxx (a local
  proxy that aggregates LLM token usage across Codex and Claude Code accounts). The
  team partners with companies such as Cal.com and Trigger.dev, works with Neon,
  Vercel, and LangChain, and publishes engineering writing on its blog. As of this
  profile there is no self-service developer API, hosted API reference, SDK, or
  pricing surface to score — this is a services and open-source lab, not an API
  provider.
